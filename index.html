<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BudgetMe">
  <title>BudgetMe</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Stili -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Dexie.js (IndexedDB) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

<div id="app">

  <!-- Header fisso -->
  <header id="header">
    <h1 id="page-title">Dashboard</h1>
    <div id="header-actions">
      <!-- Pulsante impostazioni/backup -->
      <button id="btn-settings" aria-label="Impostazioni" onclick="openSettings()">
        <i data-lucide="settings" style="width:22px;height:22px;color:var(--text-sub)"></i>
      </button>
    </div>
  </header>

  <!-- Contenuto principale (iniettato dal router) -->
  <main id="content">
    <div class="spinner"></div>
  </main>

  <!-- Navbar fissa in basso -->
  <nav id="navbar" role="navigation" aria-label="Navigazione principale">
    <button class="nav-item active" data-route="dashboard" aria-label="Dashboard">
      <i data-lucide="layout-dashboard"></i>
      <span>Home</span>
    </button>
    <button class="nav-item" data-route="budget" aria-label="Budget">
      <i data-lucide="receipt"></i>
      <span>Budget</span>
    </button>
    <button class="nav-item" data-route="conti" aria-label="Conti correnti">
      <i data-lucide="landmark"></i>
      <span>Conti</span>
    </button>
    <button class="nav-item" data-route="depositi" aria-label="Conti deposito">
      <i data-lucide="piggy-bank"></i>
      <span>Depositi</span>
    </button>
    <button class="nav-item" data-route="pac" aria-label="Portafoglio Investimenti">
      <i data-lucide="trending-up"></i>
      <span>Invest.</span>
    </button>
  </nav>

</div>

<!-- Toast container -->
<div id="toast-container" aria-live="polite"></div>

<!-- Modal impostazioni / backup -->
<div id="modal-settings" class="modal-overlay hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-header">
      <h2 class="modal-title" id="settings-title">Impostazioni</h2>
      <button class="modal-close" onclick="closeSettings()" aria-label="Chiudi">
        <i data-lucide="x"></i>
      </button>
    </div>

    <p class="section-title">Backup dati</p>
    <div id="backup-reminder" class="hidden" style="
      background:var(--orange-light); color:var(--orange);
      border-radius:var(--radius-sm); padding:10px 12px;
      font-size:0.82rem; margin-bottom:12px;
    ">
      ⚠️ Non hai ancora scaricato un backup questo mese.
    </div>
    <button class="btn btn-primary btn-full" id="btn-export">
      <i data-lucide="download"></i> Scarica backup JSON
    </button>
    <div class="mt-8"></div>
    <button class="btn btn-ghost btn-full" id="btn-import">
      <i data-lucide="upload"></i> Ripristina da backup
    </button>

    <p class="section-title mt-24">Info app</p>
    <div class="card" style="font-size:0.82rem; color:var(--text-sub)">
      <p><strong>BudgetMe</strong> v1.0</p>
      <p class="mt-8">Tutti i dati sono salvati sul dispositivo.</p>
      <p>Nessun server, nessun account.</p>
    </div>
  </div>
</div>

<!-- Script principale come modulo ES6 -->
<script type="module">
  import { initRouter } from './js/router.js';
  import { downloadBackup, triggerImport, checkBackupReminder } from './js/backup.js';

  // Inizializza icone Lucide
  lucide.createIcons();

  // Inizializza router
  await initRouter();

  // Icone nella navbar (reinizializza dopo inject HTML)
  lucide.createIcons();

  // Backup
  document.getElementById('btn-export').addEventListener('click', downloadBackup);
  document.getElementById('btn-import').addEventListener('click', triggerImport);

  // Reminder backup
  if (checkBackupReminder()) {
    document.getElementById('backup-reminder').classList.remove('hidden');
  }

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => console.log('SW registrato'))
      .catch(e => console.warn('SW non registrato:', e));
  }
</script>

<script>
  // Funzioni globali per onclick inline
  function openSettings() {
    const o = document.getElementById('modal-settings');
    o.classList.remove('hidden');
    requestAnimationFrame(() => o.classList.add('open'));
  }
  function closeSettings() {
    const o = document.getElementById('modal-settings');
    o.classList.remove('open');
    setTimeout(() => o.classList.add('hidden'), 250);
  }
  // Chiudi modal cliccando overlay
  document.getElementById('modal-settings').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
  });
</script>

</body>
</html>
